<html>
<head>
    <title>Galería de 10 Imágenes</title>
    <style>
        body {
            background-image: url(' fondo.jpeg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            margin: 0;
            padding: 20px;
        }
        
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: -1;
        }
    </style>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 20px;
        }
        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .image-pair {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        .image-card {
            width: 48%;
            text-align: center;
            background-color: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .image-card:hover {
            transform: translateY(-5px);
        }
        .image-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .image-card p {
            color: #333;
            font-size: 15px;
            margin-top: 8px;
            padding: 0 10px;
        }
        .spotify-link {
            color: #1DB954;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            display: inline-block;
            margin-top: 5px;
        }
        .spotify-link:hover {
            text-decoration: underline;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        .gallery-item {
            text-align: center;
            background-color: white;
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .gallery-item:hover {
            transform: translateY(-5px);
        }
        .gallery-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
            cursor: pointer;
        }
        .gallery-item p {
            color: #333;
            font-size: 13px;
            margin-top: 8px;
        }
        @media (max-width: 900px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 600px) {
            .image-pair {
                flex-direction: column;
            }
            .image-card {
                width: 100%;
                margin-bottom: 20px;
            }
            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
